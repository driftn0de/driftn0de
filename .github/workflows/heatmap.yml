name: Refresh heatmap

"on":
  schedule:
    - cron: "17 5 * * *"   # ~07:17 Geneva (summer), off the top of the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/heatmap.yml"]

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: python scripts/render_heatmap.py
      # Publish generated files to a single-commit 'output' branch so main's history stays clean.
      - name: Publish to output branch
        run: |
          mkdir /tmp/out && cp assets/heatmap-*.svg data/contributions.json /tmp/out/
          cd /tmp/out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "heatmap $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
